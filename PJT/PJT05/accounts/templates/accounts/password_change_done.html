{% extends "community/base.html" %}

{% block title %}비밀번호 변경 완료 — 금융 자산 커뮤니티{% endblock %}

{% block content %}
<div style="max-width:460px;margin:0 auto;text-align:center;padding:2rem 0;">
  <div style="font-size:3rem;margin-bottom:1rem;">🔐</div>
  <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;">비밀번호가 변경되었습니다</h1>
  <p style="color:var(--color-text-muted);margin-bottom:1.75rem;">
    새 비밀번호로 로그인 상태가 유지되고 있습니다.
  </p>
  <div class="btn-group" style="justify-content:center;">
    <a href="{% url 'community:asset_list' %}" class="btn">메인으로 돌아가기</a>
    <a href="{% url 'accounts:password_change' %}" class="btn btn-secondary">다시 변경</a>
  </div>
</div>
{% endblock %}

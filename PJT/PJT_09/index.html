<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SSAFY 멀티모달 챗봇 (TTS 심화)</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .chat-container { width: 500px; height: 750px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 10px 14px; border-radius: 15px; max-width: 80%; font-size: 14px; line-height: 1.4; position: relative; }
        .user { background: #0084ff; color: white; align-self: flex-end; }
        .assistant { background: #e4e6eb; color: black; align-self: flex-start; width: 85%; }
        
        .ai-image { width: 100%; max-width: 300px; border-radius: 8px; margin-top: 8px; display: block; }
        .eval-box { margin-top: 10px; padding: 10px; background: #f8f9fa; border-left: 4px solid #0084ff; border-radius: 4px; font-size: 13px; color: #333; }
        .eval-score { font-weight: bold; color: #d93025; margin-bottom: 4px; }

        /* TTS 전용 오디오 재생 버튼 템플릿 */
        .tts-btn { background: #34a853; color: white; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; margin-top: 5px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .tts-btn:hover { background: #2d8e47; }

        .status-container { display: none; align-self: flex-start; align-items: center; gap: 10px; padding: 10px; }
        .spinner { width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #0084ff; border-radius: 50%; animation: spin 1s linear infinite; }
        .status-text { font-size: 13px; color: #65676b; }
        
        .input-area { display: flex; border-top: 1px solid #e4e6eb; padding: 10px; background: #fff; }
        input { flex: 1; border: 1px solid #e4e6eb; border-radius: 20px; padding: 10px 15px; outline: none; }
        button { background: #0084ff; color: white; border: none; border-radius: 50%; width: 36px; height: 36px; margin-left: 8px; cursor: pointer; font-size: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-box" id="chatBox">
        <div class="message assistant">
            <div>안녕하세요! 무엇을 도와드릴까요? 심화 기능인 음성 합성(TTS) 테스트도 가능합니다.</div>
            <button class="tts-btn" onclick="speakText('안녕하세요! 무엇을 도와드릴까요?')">🔊 음성 듣기</button>
        </div>
        
        <div class="status-container" id="statusContainer">
            <div class="spinner"></div>
            <div class="status-text" id="statusText">부적절한 질문인지 판단중...</div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Send a message" onkeypress="if(event.keyCode==13) sendMessage()">
        <button onclick="sendMessage()">+</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputEl = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const statusContainer = document.getElementById('statusContainer');
        const statusText = document.getElementById('statusText');
        
        const text = inputEl.value.trim();
        if(!text) return;
        
        appendMessage(text, 'user');
        inputEl.value = '';
        
        chatBox.appendChild(statusContainer);
        statusContainer.style.display = 'flex';
        statusText.innerText = "부적절한 질문인지 판단중...";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            await new Promise(res => setTimeout(res, 500));
            statusText.innerText = "답변 처리 중...";

            const response = await fetch('/api/v1/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [{ role: 'user', content: text }]
                })
            });
            const data = await response.json();
            statusContainer.style.display = 'none';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant';

            if (data.type === 'image') {
                const img = document.createElement('img');
                img.src = data.url;
                img.className = 'ai-image';
                msgDiv.appendChild(img);
            } else {
                const textSpan = document.createElement('span');
                textSpan.innerText = data.content;
                msgDiv.appendChild(textSpan);
                
                // F110 필수 반영: 텍스트 답변 우측 하단에 TTS 오디오 버튼 동적 추가
                const ttsBtn = document.createElement('button');
                ttsBtn.className = 'tts-btn';
                ttsBtn.innerHTML = '🔊 음성 듣기';
                ttsBtn.onclick = () => requestTTS(data.content);
                msgDiv.appendChild(ttsBtn);
            }

            if (data.evaluation) {
                const evalDiv = document.createElement('div');
                evalDiv.className = 'eval-box';
                evalDiv.innerHTML = `
                    <div class="eval-score">질문에 대한 답변 점수: ${data.evaluation.score}/100 점</div>
                    <div><strong>이유:</strong> ${data.evaluation.reason}</div>
                `;
                msgDiv.appendChild(evalDiv);
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            
        } catch (error) {
            statusContainer.style.display = 'none';
            appendMessage("오류가 발생했습니다.", 'assistant');
        }
    }

    // 백엔드 TTS API 통신 및 브라우저 오디오 구동 함수
    async function requestTTS(targetText) {
        try {
            const response = await fetch('/api/v1/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: targetText })
            });
            const data = await response.json();
            if(data.result) {
                speakText(data.text_to_speak);
            }
        } catch (e) {
            alert("TTS 변환 실패");
        }
    }

    // 브라우저 자체 오디오 스트림 엔진 구동 (실제 소리 출력)
    function speakText(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR'; // 한국어 설정
            utterance.rate = 1.0;    // 재생 속도
            window.speechSynthesis.speak(utterance);
        } else {
            alert("이 브라우저는 음성 합성을 지원하지 않습니다.");
        }
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }    
</script>
</body>
</html>
